version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: adesso-sql
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong@Password1"
      ACCEPT_EULA: "Y"
    volumes:
      - mssqldata:/var/opt/mssql
    networks:
      - adesso-network

  api:
    build:
      context: .
      dockerfile: AdessoWorldLeague.Api/Dockerfile
    container_name: adesso-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=AdessoWorldLeagueDb;User Id=sa;Password=YourStrong@Password1;
    depends_on:
      - db
    networks:
      - adesso-network

volumes:
  mssqldata:

networks:
  adesso-network:
    driver: bridge